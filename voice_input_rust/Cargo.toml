[package]
name = "voice_input_rust"
version = "0.1.0"
edition = "2021"
authors = ["katoy"]
description = "Fully local LLM voice input desktop application written in Rust"

[dependencies]
# Audio capture
cpal = "0.15"

# Async & Runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# System interaction (Clipboard & Key simulation)
arboard = "3.4"
enigo = "0.2"

# GUI & HUD
eframe = "0.29"
egui = "0.29"

# Local ASR Engine
whisper-rs = { version = "0.13", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = "0.2"

[dev-dependencies]

tokio-test = "0.4"
