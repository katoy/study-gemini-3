{% extends "base.html" %}

{% block title %}ヘルプ{% endblock %}

{% block content %}
<div class="help-container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <div class="help-content">
    {{ help_content | safe }}
  </div>
  <div style="margin-top: 2rem; text-align: center;">
    <button onclick="window.history.back()" class="primary">戻る</button>
  </div>
</div>

<style>
.help-container {
  line-height: var(--line-height-base);
  font-size: var(--font-size-base);
}

.help-content h1,
.help-content h2,
.help-content h3 {
  margin-top: 1.5rem;
  margin-bottom: 0.75rem;
  color: var(--color-text);
}

.help-content h1 {
  border-bottom: 2px solid var(--color-accent);
  padding-bottom: 0.5rem;
}

.help-content h2 {
  border-left: 4px solid var(--color-accent);
  padding-left: 0.75rem;
}

.help-content p {
  margin-bottom: 0.75rem;
  color: var(--color-text-secondary);
}

.help-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
}

.help-content table th,
.help-content table td {
  border: 1px solid var(--color-border);
  padding: 0.75rem;
  text-align: left;
}

.help-content table th {
  background-color: var(--color-surface);
  color: var(--color-text);
  font-weight: bold;
}

.help-content code {
  background-color: var(--color-surface);
  color: var(--color-accent);
  padding: 0.2rem 0.4rem;
  border-radius: 3px;
  font-family: "Monaco", "Courier New", monospace;
  font-size: 0.9em;
}

.help-content pre {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 1rem;
  overflow-x: auto;
  margin: 1rem 0;
}

.help-content pre code {
  background: none;
  color: var(--color-text);
  padding: 0;
}

.help-content ul,
.help-content ol {
  margin: 0.5rem 0 0.5rem 1.5rem;
}

.help-content li {
  margin-bottom: 0.5rem;
}

.help-content blockquote {
  border-left: 4px solid var(--color-accent);
  padding-left: 1rem;
  margin: 1rem 0;
  color: var(--color-text-secondary);
}
</style>
{% endblock %}
