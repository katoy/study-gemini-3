{% if programs %}
{% for program in programs %}
<div class="sidebar-program-item"
  hx-get="/programs/{{ program.site_id }}_{{ program.corner_id }}/episodes"
  hx-target="#episode-panel"
  hx-indicator="#sidebar-spinner"
  hx-vals='{"program": {{ program | tojson }}}'
  hx-on::after-request="document.querySelectorAll('.sidebar-program-item').forEach(el=>el.classList.remove('active')); this.classList.add('active')">
  <span class="sidebar-program-name">{{ program.display_title }}</span>
  <span class="sidebar-program-meta">
    <span class="sidebar-genre-badge">{{ program.genre_label }}</span>
    {{ program.area }}
  </span>
</div>
{% endfor %}
{% else %}
<div class="activity-empty">番組が見つかりません</div>
{% endif %}
