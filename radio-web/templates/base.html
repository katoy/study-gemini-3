<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NHK ラジオ聞き逃し{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/themes.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script>
    async function startDL(btn) {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const resp = await fetch('/download', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            program: JSON.parse(btn.dataset.program),
            episode: JSON.parse(btn.dataset.episode)
          })
        });
        const html = await resp.text();
        if (!resp.ok) { btn.textContent = '✗'; btn.disabled = false; return; }
        // ボタンをステータス HTML フラグメントに差し替え、htmx ポーリングを起動
        const tmp = document.createElement('span');
        tmp.innerHTML = html;
        const node = tmp.firstElementChild || tmp;
        btn.replaceWith(node);
        htmx.process(node);
      } catch (err) {
        btn.textContent = '✗';
        btn.disabled = false;
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--color-primary); color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
    header h1 { font-size: 1.3rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: #fff; letter-spacing: -0.5px; }
    .header-nav { display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0; margin-left: auto; }
    header nav { display: flex; gap: 1.8rem; font-size: 0.96rem; font-weight: 500; }
    header nav a { color: #fff; text-decoration: none; transition: color 0.2s, opacity 0.2s; border-bottom: 2px solid transparent; padding-bottom: 2px; }
    header nav a:hover { color: #fff; border-bottom-color: rgba(255,255,255,0.6); opacity: 0.95; }
    .theme-toggle { background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); padding: 0.55rem 0.85rem; font-size: 1.1rem; border-radius: 6px; cursor: pointer; transition: background 0.2s, border-color 0.2s; font-weight: 600; display: flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; }
    .theme-toggle:hover { background: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.5); }
    .font-size-controls { display: flex; gap: 0.35rem; }
    .font-size-btn { background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); padding: 0.45rem 0.55rem; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s, border-color 0.2s; font-size: 0.85rem; }
    .font-size-btn:hover { background: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.5); }
    @media (max-width: 768px) {
      header { padding: 0.85rem 1rem; gap: 0.8rem; }
      .header-search { min-width: 160px; max-width: 250px; }
      header nav { gap: 1rem; font-size: 0.9rem; }
      .header-nav { gap: 0.5rem; }
    }
    main { flex: 1; overflow-y: auto; }
    main.page-main { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; width: 100%; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
    .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid #aaa; border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-content { background: var(--color-bg); color: var(--color-text); border-radius: 8px; padding: 2rem; max-width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    /* ダークモード向けヘッダースタイル */
    html[data-theme="dark"] header nav a {
      color: #fff;
      font-weight: 600;
    }
    html[data-theme="dark"] .theme-toggle {
      background: rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.6);
    }
    html[data-theme="dark"] .theme-toggle:hover {
      background: rgba(0,0,0,0.4);
      border-color: rgba(255,255,255,0.8);
    }
    html[data-theme="dark"] .font-size-btn {
      background: rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.6);
    }
    html[data-theme="dark"] .font-size-btn:hover {
      background: rgba(0,0,0,0.4);
      border-color: rgba(255,255,255,0.8);
    }
  </style>
  <script>
    // テーマ・フォントサイズの初期化
    function initTheme() {
      const saved = localStorage.getItem('theme') || 'auto';
      const html = document.documentElement;
      if (saved === 'auto') {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
      } else {
        html.setAttribute('data-theme', saved);
      }
    }
    function initFontSize() {
      const saved = localStorage.getItem('fontSize') || 'medium';
      const html = document.documentElement;
      if (saved === 'medium') {
        html.removeAttribute('data-font-size');
      } else {
        html.setAttribute('data-font-size', saved === 'small' ? 'small' : 'large');
      }
    }
    initTheme();
    initFontSize();
    // DOMContentLoaded 後に button を更新
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof updateThemeButton === 'function') updateThemeButton();
    });
  </script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <h1>📻</h1>
    <div class="header-nav">
      <nav>
        <a href="/">ホーム</a>
        <a href="/downloads">ダウンロード</a>
        <a href="/help">ヘルプ</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
      <div class="font-size-controls" style="display: flex; gap: 0.25rem;">
        <button class="font-size-btn" onclick="setFontSize('small')" title="フォント小" style="font-size: 0.8rem;">A</button>
        <button class="font-size-btn" onclick="setFontSize('medium')" title="フォント中" style="font-size: 1rem;">A</button>
        <button class="font-size-btn" onclick="setFontSize('large')" title="フォント大" style="font-size: 1.2rem;">A</button>
      </div>
    </div>
  </header>
  <main class="{% block main_class %}page-main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <!-- 永続プレーヤーバー (HLS ストリーミング用) -->
  <div id="player-bar" class="player-bar" style="display: none;">
    <div class="player-content">
      <div class="player-info">
        <div class="player-title" id="player-title">番組を選択してください</div>
        <div class="player-time" id="player-time">00:00 / 00:00</div>
      </div>
      <div class="player-controls">
        <button id="player-play-btn" class="player-btn" onclick="togglePlayback()">▶</button>
        <div class="player-progress" id="player-progress">
          <div class="player-progress-bar" id="player-progress-bar"></div>
        </div>
        <button id="player-close-btn" class="player-btn" onclick="closePlayer()" title="プレーヤーを閉じる">✕</button>
      </div>
    </div>
  </div>
  <!-- ステータスバー -->
  <footer class="status-bar">
    <span id="status-message">準備完了</span>
    <div class="shortcut-hints">
      <kbd>/</kbd> 検索 &nbsp; <kbd>g</kbd> ジャンル &nbsp;
      <kbd>↑↓</kbd> スクロール &nbsp; <kbd>Space</kbd> ページ &nbsp;
      <kbd>F1</kbd> ヘルプ &nbsp; <kbd>Esc</kbd> 閉じる
    </div>
  </footer>
  <!-- 右クリックコンテキストメニュー -->
  <div id="context-menu" class="context-menu" style="display:none;">
    <ul>
      <li data-action="open-nhk">🔗 番組ページを開く</li>
      <li data-action="copy-title">📋 タイトルをコピー</li>
      <li data-action="copy-filename">📋 ファイル名をコピー</li>
      <li class="separator"></li>
      <li data-action="redownload">↩ 再ダウンロード</li>
      <li data-action="delete-file" class="destructive">🗑 ファイルを削除</li>
    </ul>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
