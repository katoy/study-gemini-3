<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NHK ラジオ聞き逃し{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/themes.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script>
    async function startDL(btn) {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const resp = await fetch('/download', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            program: JSON.parse(btn.dataset.program),
            episode: JSON.parse(btn.dataset.episode)
          })
        });
        const html = await resp.text();
        if (!resp.ok) { btn.textContent = '✗'; btn.disabled = false; return; }
        // ボタンをステータス HTML フラグメントに差し替え、htmx ポーリングを起動
        const tmp = document.createElement('span');
        tmp.innerHTML = html;
        const node = tmp.firstElementChild || tmp;
        btn.replaceWith(node);
        htmx.process(node);
      } catch (err) {
        btn.textContent = '✗';
        btn.disabled = false;
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--color-primary); color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
    header h1 { font-size: 1.3rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: #fff; letter-spacing: -0.5px; }
    .header-nav { display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0; margin-left: auto; }
    header nav { display: flex; gap: 1.8rem; font-size: 0.96rem; font-weight: 500; }
    header nav a { color: #fff; text-decoration: none; transition: color 0.2s, opacity 0.2s; border-bottom: 2px solid transparent; padding-bottom: 2px; }
    header nav a:hover { color: #fff; border-bottom-color: rgba(255,255,255,0.6); opacity: 0.95; }
    .settings-btn { background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); padding: 0.55rem 0.85rem; font-size: 1.1rem; border-radius: 6px; cursor: pointer; transition: background 0.2s, border-color 0.2s; font-weight: 600; display: flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; }
    .settings-btn:hover { background: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.5); }
    @media (max-width: 768px) {
      header { padding: 0.85rem 1rem; gap: 0.8rem; }
      .header-search { min-width: 160px; max-width: 250px; }
      header nav { gap: 1rem; font-size: 0.9rem; }
      .header-nav { gap: 0.5rem; }
    }
    main { flex: 1; overflow-y: auto; }
    main.page-main { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; width: 100%; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
    .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid #aaa; border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease-in-out; }
    .modal.show { display: flex; opacity: 1; }
    .modal-content { background: var(--color-bg); color: var(--color-text); border-radius: 8px; padding: 2rem; max-width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.3s ease-in-out; }
    .modal.show .modal-content { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 1rem; }
    .modal-header h2 { font-size: 1.3rem; font-weight: 600; margin: 0; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--color-text); opacity: 0.6; transition: opacity 0.2s; }
    .modal-close:hover { opacity: 1; }
    .modal-body { margin-bottom: 1.5rem; }
    .setting-group { margin-bottom: 1.5rem; }
    .setting-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
    .setting-group .description { font-size: 0.85rem; color: rgba(0, 0, 0, 0.6); margin-top: 0.25rem; }
    html[data-theme="dark"] .setting-group .description { color: rgba(255, 255, 255, 0.5); }
    .radio-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .radio-option { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border: 2px solid transparent; border-radius: 6px; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: rgba(0, 0, 0, 0.05); }
    .radio-option:hover { background: rgba(0, 0, 0, 0.1); }
    html[data-theme="dark"] .radio-option { background: rgba(255, 255, 255, 0.1); }
    html[data-theme="dark"] .radio-option:hover { background: rgba(255, 255, 255, 0.15); }
    .radio-option input { cursor: pointer; }
    .radio-option.selected { border-color: var(--color-primary); background: rgba(var(--color-primary-rgb), 0.1); font-weight: 600; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid rgba(0, 0, 0, 0.1); }
    .modal-btn { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .modal-btn-cancel { background: rgba(0, 0, 0, 0.1); color: var(--color-text); }
    .modal-btn-cancel:hover { background: rgba(0, 0, 0, 0.15); }
    .modal-btn-ok { background: var(--color-primary); color: #fff; }
    .modal-btn-ok:hover { opacity: 0.9; }
    html[data-theme="dark"] .modal-header { border-bottom-color: rgba(255, 255, 255, 0.2); }
    html[data-theme="dark"] .modal-footer { border-top-color: rgba(255, 255, 255, 0.2); }
    html[data-theme="dark"] .modal-btn-cancel { background: rgba(255, 255, 255, 0.1); color: #fff; }
    html[data-theme="dark"] .modal-btn-cancel:hover { background: rgba(255, 255, 255, 0.15); }
    .font-size-slider-container { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    .font-size-label { font-size: 0.9rem; font-weight: 500; white-space: nowrap; min-width: 24px; text-align: center; }
    .font-size-slider { flex: 1; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.1); outline: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
    html[data-theme="dark"] .font-size-slider { background: rgba(255, 255, 255, 0.2); }
    .font-size-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); cursor: pointer; transition: box-shadow 0.2s; }
    .font-size-slider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 6px rgba(var(--color-primary-rgb), 0.2); }
    .font-size-slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); border: none; cursor: pointer; transition: box-shadow 0.2s; }
    .font-size-slider::-moz-range-thumb:hover { box-shadow: 0 0 0 6px rgba(var(--color-primary-rgb), 0.2); }
    .font-size-display { text-align: center; font-size: 0.9rem; color: rgba(0, 0, 0, 0.7); font-weight: 500; }
    html[data-theme="dark"] .font-size-display { color: rgba(255, 255, 255, 0.7); }
  </style>
  <script>
    // テーマ・フォントサイズの初期化
    function initTheme() {
      const saved = localStorage.getItem('theme') || 'auto';
      const html = document.documentElement;
      if (saved === 'auto') {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
      } else {
        html.setAttribute('data-theme', saved);
      }
    }
    function initFontSize() {
      const saved = localStorage.getItem('fontSize') || '100';
      const percentage = parseInt(saved);
      const html = document.documentElement;
      html.style.setProperty('--font-size-scale', percentage / 100);
    }
    initTheme();
    initFontSize();
    // DOMContentLoaded 後に button を更新
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof updateThemeButton === 'function') updateThemeButton();
    });

    // 表示設定モーダル管理
    let settingsBackup = { theme: 'auto', fontSize: 100 };

    function openSettingsModal() {
      const modal = document.getElementById('settingsModal');
      const theme = localStorage.getItem('theme') || 'auto';
      const fontSize = localStorage.getItem('fontSize') || '100';
      settingsBackup = { theme, fontSize: parseInt(fontSize) };
      updateModalUI(theme, fontSize);
      modal.classList.add('show');
    }

    function closeSettingsModal() {
      const modal = document.getElementById('settingsModal');
      modal.classList.remove('show');
    }

    function updateModalUI(theme, fontSize) {
      // テーマラジオボタンを更新
      document.querySelectorAll('.radio-option[data-theme]').forEach(opt => {
        const isSelected = opt.dataset.theme === theme;
        opt.classList.toggle('selected', isSelected);
        opt.querySelector('input').checked = isSelected;
      });
      // フォントサイズスライダーと表示を更新
      const sliderValue = parseInt(fontSize) || 100;
      document.getElementById('fontSizeSlider').value = sliderValue;
      updateFontSizeDisplay(sliderValue);
    }

    function updateFontSizeDisplay(sliderValue) {
      const display = document.getElementById('fontSizeDisplay');
      if (display) display.textContent = sliderValue + '%';
    }

    function handleFontSizeChange(sliderValue) {
      const percentage = parseInt(sliderValue);
      localStorage.setItem('fontSize', percentage.toString());
      updateFontSizeDisplay(percentage);
      // フォントサイズスケールを CSS 変数で反映
      const html = document.documentElement;
      html.style.setProperty('--font-size-scale', percentage / 100);
      settingsBackup.fontSize = percentage;
    }

    function applyTheme(theme) {
      localStorage.setItem('theme', theme);
      const html = document.documentElement;
      if (theme === 'auto') {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
      } else {
        html.setAttribute('data-theme', theme);
      }
      settingsBackup.theme = theme;
    }

    function cancelSettings() {
      const theme = settingsBackup.theme;
      const fontSize = settingsBackup.fontSize;
      updateModalUI(theme, fontSize);
      // テーマを復元
      applyTheme(theme);
      closeSettingsModal();
    }

    function confirmSettings() {
      // 現在の設定は既に適用済み
      closeSettingsModal();
    }

    // モーダル内のテーマラジオボタンをクリック可能にする
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.radio-option[data-theme]').forEach(opt => {
        opt.addEventListener('click', function() {
          const input = this.querySelector('input');
          input.checked = true;
          applyTheme(input.value);
        });
      });
    });
  </script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <h1>📻 NHK Radio</h1>
    <div class="header-nav">
      <nav>
        <a href="/">ホーム</a>
        <a href="/downloads">ダウンロード</a>
        <a href="/help">ヘルプ</a>
      </nav>
      <button class="settings-btn" id="settingsBtn" onclick="openSettingsModal()" title="表示設定">⚙️</button>
    </div>
  </header>
  <main class="{% block main_class %}page-main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <!-- 永続プレーヤーバー (HLS ストリーミング用) -->
  <div id="player-bar" class="player-bar" style="display: none;">
    <div class="player-content">
      <div class="player-info">
        <div class="player-title" id="player-title">番組を選択してください</div>
        <div class="player-time" id="player-time">00:00 / 00:00</div>
      </div>
      <div class="player-controls">
        <button id="player-play-btn" class="player-btn" onclick="togglePlayback()">▶</button>
        <div class="player-progress" id="player-progress">
          <div class="player-progress-bar" id="player-progress-bar"></div>
        </div>
        <button id="player-close-btn" class="player-btn" onclick="closePlayer()" title="プレーヤーを閉じる">✕</button>
      </div>
    </div>
  </div>
  <!-- 表示設定モーダル -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>表示機能設定</h2>
        <button class="modal-close" onclick="closeSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>テーマ</label>
          <div class="radio-group">
            <label class="radio-option" data-theme="light">
              <input type="radio" name="theme" value="light">
              <span>☀️ ライト</span>
            </label>
            <label class="radio-option" data-theme="dark">
              <input type="radio" name="theme" value="dark">
              <span>🌙 ダーク</span>
            </label>
            <label class="radio-option" data-theme="auto">
              <input type="radio" name="theme" value="auto">
              <span>🔄 自動</span>
            </label>
          </div>
        </div>
        <div class="setting-group">
          <label>フォントサイズ</label>
          <div class="font-size-slider-container">
            <span class="font-size-label">50%</span>
            <input type="range" id="fontSizeSlider" name="fontSize" min="50" max="200" step="10" value="100" class="font-size-slider" oninput="handleFontSizeChange(this.value)">
            <span class="font-size-label">200%</span>
          </div>
          <div class="font-size-display" id="fontSizeDisplay">100%</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" onclick="cancelSettings()">キャンセル</button>
        <button class="modal-btn modal-btn-ok" onclick="confirmSettings()">OK</button>
      </div>
    </div>
  </div>
  <!-- ステータスバー -->
  <footer class="status-bar">
    <span id="status-message">準備完了</span>
    <div class="shortcut-hints">
      <kbd>/</kbd> 検索 &nbsp; <kbd>g</kbd> ジャンル &nbsp;
      <kbd>↑↓</kbd> スクロール &nbsp; <kbd>Space</kbd> ページ &nbsp;
      <kbd>F1</kbd> ヘルプ &nbsp; <kbd>Esc</kbd> 閉じる
    </div>
  </footer>
  <!-- 右クリックコンテキストメニュー -->
  <div id="context-menu" class="context-menu" style="display:none;">
    <ul>
      <li data-action="open-nhk">🔗 番組ページを開く</li>
      <li data-action="copy-title">📋 タイトルをコピー</li>
      <li data-action="copy-filename">📋 ファイル名をコピー</li>
      <li class="separator"></li>
      <li data-action="redownload">↩ 再ダウンロード</li>
      <li data-action="delete-file" class="destructive">🗑 ファイルを削除</li>
    </ul>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
