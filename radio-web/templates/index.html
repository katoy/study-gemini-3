{% extends "base.html" %}

{% block head %}
<style>
  .filter-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .filter-bar label { font-weight: 600; }
  .filter-bar select { padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
  #program-list-area { min-height: 4rem; }
</style>
{% endblock %}

{% block content %}
<section class="filter-bar">
  <label for="genre-select">ジャンル</label>
  <select id="genre-select"
          hx-get="/programs"
          hx-target="#program-list-area"
          hx-trigger="change"
          hx-indicator="#loading"
          name="genre">
    {% for opt in genre_options %}
    <option value="{{ opt.value }}" {% if opt.value == selected_genre %}selected{% endif %}>
      {{ opt.label }}
    </option>
    {% endfor %}
  </select>
  <span id="loading" class="htmx-indicator"><span class="spinner"></span> 読み込み中…</span>
</section>

<div id="program-list-area">
  {% include "partials/program_list.html" %}
</div>
{% endblock %}
