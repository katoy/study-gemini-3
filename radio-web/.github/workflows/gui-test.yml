name: Playwright GUI テスト

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: uv をインストール
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 依存関係をインストール
        run: |
          uv sync
          uv pip install playwright
          playwright install chromium

      - name: サーバーをバックグラウンドで起動
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/server.log 2>&1 &
          sleep 10

      - name: GUI テストを実行（headless モード）
        run: |
          cd radio-web
          python browser_test_ci.py

      - name: スクリーンショットをアップロード
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-screenshots
          path: /tmp/browser_test.png
          retention-days: 7

      - name: サーバーログをアップロード
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: server-logs
          path: /tmp/server.log
          retention-days: 7
