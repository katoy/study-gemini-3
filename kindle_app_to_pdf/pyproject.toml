[project]
name = "kindle-app-to-pdf"
version = "1.0.0"
description = "Convert Kindle app books to PDF (Mac/Windows compatible)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "katoy", email = "katoy@media-5.co.jp"}
]
license = {text = "MIT"}
keywords = ["kindle", "pdf", "screenshot", "mac", "windows"]

dependencies = [
    "img2pdf>=0.5.0",
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.50; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/katoy/study-gemini-3"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = false
warn_unreachable = true
exclude = ["^output/"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: End-to-end tests that interact with real applications",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if sys.platform == .win32.:",
    "if platform.system() == .Windows.:",
    "class WindowsKindleCapturer",
    "def __repr__",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
fail_under = 100

