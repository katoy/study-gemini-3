[project]
name = "kindle-to-pdf"
version = "0.1.1"
description = "Kindle 本をキャプチャして高品質な PDF を生成するツール"
requires-python = ">=3.12"
dependencies = [
    "img2pdf>=0.6.0",
    "playwright>=1.50.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
