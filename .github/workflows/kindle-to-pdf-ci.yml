name: kindle-to-pdf CI

on:
  push:
    paths:
      - "kindle_to_pdf/**"
      - ".github/workflows/kindle-to-pdf-ci.yml"
  pull_request:
    paths:
      - "kindle_to_pdf/**"
      - ".github/workflows/kindle-to-pdf-ci.yml"

defaults:
  run:
    working-directory: kindle_to_pdf

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run mypy *.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run pytest --cov=. --cov-report=term-missing -v
