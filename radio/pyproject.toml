[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radio"
version = "0.1.0"
description = "NHK ラジオ聞き逃し番組ダウンローダー"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pycryptodomex>=3.23.0",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
nhk-radio = "nhk_radio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
nhk_radio = ["help.md"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src/nhk_radio --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/nhk_radio"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line-too-long
]

[tool.ruff.lint.isort]
known-first-party = ["nhk_radio"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# GUI Mixin: Protocol ベース設計により attr-defined は冗長（Protocol が検証）
[[tool.mypy.overrides]]
module = "nhk_radio.gui.listing.*"
disable_error_code = ["attr-defined", "has-type", "assignment", "arg-type", "misc"]

# GUI browser: Mixin 基底クラスの型は複数源（Protocol で制御）
[[tool.mypy.overrides]]
module = "nhk_radio.gui.browser"
disable_error_code = ["misc", "assignment"]
