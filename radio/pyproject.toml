[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radio"
version = "0.1.0"
description = "NHK ラジオ聞き逃し番組ダウンローダー"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pycryptodomex>=3.23.0",
    "yt-dlp",
]

[project.scripts]
nhk-radio = "nhk_radio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
nhk_radio = ["help.md"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src/nhk_radio --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/nhk_radio"]

[tool.coverage.report]
show_missing = true
